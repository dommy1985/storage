<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scanner Intelligente - PCTO</title>
  <style>
    body { 
      font-family: 'Roboto', sans-serif; 
      text-align: center; 
      background-color: #e3f2fd; /* Azzurrino rilassante */
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    h1 { color: #1565c0; text-transform: uppercase; font-size: 3rem; margin-bottom: 10px; }
    p { font-size: 1.5rem; font-weight: bold; color: #333; margin-bottom: 40px;}
    
    #start-btn { 
      background-color: #ff9800; 
      color: white; 
      border: none; 
      padding: 20px 50px; 
      font-size: 2rem; 
      border-radius: 50px; 
      cursor: pointer; 
      font-weight: bold; 
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
      transition: transform 0.2s, background-color 0.2s;
    }
    #start-btn:hover { background-color: #f57c00; transform: scale(1.05); }
    
    #webcam-container { 
      margin: 20px auto; 
      border: 8px solid #1565c0; 
      border-radius: 20px; 
      overflow: hidden; 
      display: inline-block; 
      background-color: #000;
      box-shadow: 0 10px 20px rgba(0,0,0,0.2);
    }
    
    #label-container div { 
      font-size: 3.5rem; 
      font-weight: bold; 
      margin-top: 30px; 
      color: #d32f2f; 
      text-transform: uppercase; 
      background: white; 
      padding: 15px 40px; 
      border-radius: 20px; 
      display: inline-block;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      border: 4px solid #d32f2f;
    }
  </style>
</head>
<body>

  <h1>🤖 LO SCANNER INTELLIGENTE</h1>
  <p>PREMI "INIZIA" E MOSTRA IL PRODOTTO ALLA TELECAMERA</p>
  
  <button id="start-btn" type="button" onclick="init()">INIZIA</button>
  
  <div id="webcam-container"></div>
  <div id="label-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  <script type="text/javascript">
      // IL TUO LINK ESATTO CON LA SBARRETTA FINALE
      const URL = "https://teachablemachine.withgoogle.com/models/eNA1CiHHK/";

      let model, webcam, labelContainer, maxPredictions;

      async function init() {
          const modelURL = URL + "model.json";
          const metadataURL = URL + "metadata.json";

          // Cambia il testo del bottone per far capire che sta caricando
          document.getElementById("start-btn").innerText = "CARICAMENTO...";

          try {
              model = await tmImage.load(modelURL, metadataURL);
              maxPredictions = model.getTotalClasses();

              // Impostazioni telecamera (più grande e definita)
              const flip = true; 
              webcam = new tmImage.Webcam(400, 400, flip); 
              await webcam.setup(); // Chiede il permesso alla telecamera
              await webcam.play();
              window.requestAnimationFrame(loop);

              document.getElementById("webcam-container").appendChild(webcam.canvas);
              labelContainer = document.getElementById("label-container");
              
              // Nasconde il bottone quando parte la telecamera
              document.getElementById("start-btn").style.display = "none";
          } catch (error) {
              alert("Ops! Non riesco ad accendere la fotocamera. Assicurati di aver cliccato su 'Consenti' quando il browser te lo chiede!");
              document.getElementById("start-btn").innerText = "RIPROVA";
          }
      }

      async function loop() {
          webcam.update(); 
          await predict();
          window.requestAnimationFrame(loop);
      }

      async function predict() {
          const prediction = await model.predict(webcam.canvas);
          let bestPrediction = "";
          let highestProbability = 0;

          // Cerca la previsione più sicura
          for (let i = 0; i < maxPredictions; i++) {
              if(prediction[i].probability > highestProbability) {
                  highestProbability = prediction[i].probability;
                  bestPrediction = prediction[i].className;
              }
          }
          
          // Mostra il risultato in grande solo se è sicuro all'85%
          if (highestProbability > 0.85) {
               labelContainer.innerHTML = "<div>" + bestPrediction + "</div>";
          } else {
               labelContainer.innerHTML = "<div>STO PENSANDO...</div>";
          }
      }
  </script>
</body>
</html>
